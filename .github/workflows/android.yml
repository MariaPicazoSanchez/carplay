name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build and verify signed APKs
        env:
          RELEASE_KEY_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.RUTA_SIGNING_KEY_BASE64 || '' }}
          RUTA_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.RUTA_KEY_PASSWORD || '' }}
        run: |
          export RUTA_SIGNING_KEY="$RUNNER_TEMP/ruta.p12"
          trap 'rm -f "$RUTA_SIGNING_KEY"' EXIT
          if [[ -n "$RELEASE_KEY_BASE64" && -n "$RUTA_KEY_PASSWORD" ]]; then
            umask 077
            printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$RUTA_SIGNING_KEY"
          elif [[ -z "$RELEASE_KEY_BASE64" && -z "$RUTA_KEY_PASSWORD" ]]; then
            RUTA_KEY_PASSWORD="$(openssl rand -hex 24)"
            export RUTA_KEY_PASSWORD
            keytool -genkeypair -keystore "$RUTA_SIGNING_KEY" -storetype PKCS12 \
              -storepass:env RUTA_KEY_PASSWORD -alias ruta -keyalg RSA \
              -keysize 3072 -validity 365 -dname "CN=Ruta Panel CI"
          else
            echo "::error::Configure both Android signing secrets or leave both unset."
            exit 1
          fi
          unset RELEASE_KEY_BASE64
          bash tools/build.sh
          bash tools/build-tests.sh
          python3 tests/auditar_apk.py

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          disable-animations: true
          script: bash tools/run-tests.sh

      - name: Generate APK checksum
        working-directory: build
        run: sha256sum Ruta-Panel-1.0.0.apk > SHA256.txt

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruta-Panel-Android
          path: |
            build/Ruta-Panel-1.0.0.apk
            build/SHA256.txt
          if-no-files-found: error
