plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'es.maria.rutapanel'
    compileSdk 35

    defaultConfig {
        applicationId 'es.maria.rutapanel'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
        manifestPlaceholders = [mapsApiKey: providers.environmentVariable('RUTA_MAPS_API_KEY')
            .orElse(providers.gradleProperty('RUTA_MAPS_API_KEY')).getOrElse('RUTA_MAPS_UNCONFIGURED')]
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.libraries.navigation:navigation:6.3.3'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
